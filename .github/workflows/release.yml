# Publishing a GitHub release (tag "v1.2.3" or "1.2.3") attaches module.json + module.zip to it.
# Adapted from League-of-Foundry-Developers/FoundryVTT-Module-Template.
# Install URL (always latest): https://github.com/<owner>/<repo>/releases/latest/download/module.json
# On foundryvtt.com/admin, register each version's own manifest URL, never the /latest one.
name: Release module

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Stamp manifest
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          m=packages/foundry-module/module.json
          jq --arg v "${TAG#v}" --arg repo "$REPO" --arg tag "$TAG" \
            '.version=$v | .url=$repo | .manifest="\($repo)/releases/latest/download/module.json" | .download="\($repo)/releases/download/\($tag)/module.zip"' \
            "$m" > m.tmp && mv m.tmp "$m"
      - name: Build module.zip (manifest at the archive root)
        run: |
          node scripts/build-module.mjs
          (cd dist/foundry-flight-recorder && zip -qr ../../module.zip .)
          cp dist/foundry-flight-recorder/module.json module.json
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" module.json module.zip --clobber
