# docker compose -f docker/compose.yml --env-file .env up -d
# Admin/analysis: docker compose -f docker/compose.yml exec collector node packages/analysis-cli/ffr.mjs sessions
services:
  collector:
    build: { context: .., dockerfile: docker/Dockerfile }
    image: foundry-flight-recorder-collector:0.1.0
    restart: unless-stopped
    environment:
      FFR_INGEST_KEY: ${FFR_INGEST_KEY:?set FFR_INGEST_KEY in .env}
      FFR_ALLOWED_ORIGINS: ${FFR_ALLOWED_ORIGINS:?set FFR_ALLOWED_ORIGINS in .env}
      FFR_RETENTION_DAYS: ${FFR_RETENTION_DAYS:-180}
      FFR_MAX_DB_MB: ${FFR_MAX_DB_MB:-2048}
      FFR_SESSION_IDLE_MIN: ${FFR_SESSION_IDLE_MIN:-240}
      FFR_TRUST_PROXY: ${FFR_TRUST_PROXY:-0}
    # Private volume: NOT inside Foundry's Data directory (which Foundry serves publicly).
    volumes: ["${FFR_DATA_DIR:-../data}:/data"]
    # Bind to localhost; expose through your reverse proxy (HTTPS) or change for LAN use.
    ports: ["127.0.0.1:4318:4318"]
